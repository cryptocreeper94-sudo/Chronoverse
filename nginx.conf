server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|mp3|ogg|wav|glb|gltf|json)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
